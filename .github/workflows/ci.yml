name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build and test (macOS)
    # macOS 26 ships Xcode 26 by default, which is where Swift 6.2 (the package's tools version) lives.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      # Printed so a failing run says which toolchain it was, without anyone having to guess.
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      # docs/spec-feature-matrix.{html,yaml} are generated from scripts/spec-feature-matrix.json.
      # Checking here means the promise "the table is regenerated, never hand-edited" is enforced
      # rather than remembered. Standard library only — no Python packages to install.
      - name: Generated documents match their source
        run: |
          python3 scripts/build-spec-feature-matrix.py --check
          python3 scripts/build-performance-page.py --check
          python3 scripts/build-cookbook.py --check
          python3 scripts/build-interoperability-page.py --check
          python3 scripts/check-public-docs.py --self-test
          python3 scripts/check-public-docs.py
          python3 scripts/check-public-fixtures.py --self-test
          python3 scripts/check-public-fixtures.py
          python3 Tests/OpenpyxlParity/check.py --quiet

      - name: Build
        run: swift build --build-tests

      # The measuring bench is a package of its own, so a narrowing of the public surface can leave it
      # uncompilable without anything noticing — which is what happened between 0.20.0 and Appendix B.51.
      - name: The measuring bench still builds against the public surface
        run: swift build --package-path Benchmarks

      # The cookbook's code is a package too (docs/cookbook.md is generated from it). Building it proves every
      # recipe compiles against the public surface; running it proves each one still does what the page says.
      - name: The cookbook's recipes build and run
        run: |
          swift build --package-path Examples
          swift run --package-path Examples swiftsheets-examples all "$RUNNER_TEMP/cookbook"

      - name: Write API results and removed data conveniences
        run: python3 scripts/check-write-result-api.py

      # `package` is invisible to the tests, which live in the same package, so what an outside client can
      # reach is proved from an outside client: a throwaway SwiftPM package that depends on this checkout,
      # calls the public preservation API, and must fail to compile for every name that moved (spec B.46).
      - name: Preservation API has an external boundary
        run: python3 scripts/check-preservation-api.py

      # And the other boundary: an outside client names formats by Codec value, and reaches no codec itself.
      - name: Codecs are chosen by value from outside
        run: python3 scripts/check-codec-api.py

      # A row-by-row write answers with the save it made, and the parts that save is built from stay inside
      # the package (spec Appendix B.51).
      - name: The row-by-row writer's save contract holds from outside
        run: python3 scripts/check-streaming-api.py

      # What the README promises about encryption code is read off symbol tables, not remembered: the plain
      # products link no cipher, SheetDecrypt nothing that encrypts (spec Appendix B.39.9). A positive control
      # inside the script keeps the check honest.
      - name: The plain products carry no cipher
        run: scripts/check-no-crypto.sh

      # The suites that need LibreOffice, Numbers.app, or a Python with openpyxl / numbers-parser
      # skip themselves when those are absent (`.enabled(if:)`), so a bare runner is enough.
      - name: Test
        run: swift test --skip-build

      # The same suite again over the other DEFLATE. macOS has both toolboxes, so the zlib route can be put
      # under every round trip here — the Linux job would catch a break in it too, but this one catches it
      # without waiting on a second machine, and it fails for one reason only.
      - name: Test the zlib route
        run: swift test -Xswiftc -DSWIFTSHEETS_ZLIB

      # And once more over Foundation's XML parser instead of the byte scanner (spec Appendix B.39.6). The
      # scanner is the default; the old path stays for one release so that every reader is proven to give the
      # same answer either way, and so that a scanner fault has a known-good route to compare against.
      - name: Test the Foundation XML route
        run: swift test -Xswiftc -DSWIFTSHEETS_FOUNDATION_XML

  linux:
    name: build and test (Linux)
    # The judge for the half of the library that is not Apple's: Foundation is a different implementation here,
    # and DEFLATE comes from the system zlib rather than Apple's Compression framework. A green macOS run says
    # nothing about either, which is why this job exists rather than a line in the README.
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: swift --version

      # zlib is what `Deflate` folds bytes with here. The runtime library is already installed; the header is
      # what a build needs, and the Swift image does not promise to carry it. The image carries no Python at
      # all — unlike the macOS runner — so the interpreter the compile-time checks need is installed here too.
      - name: zlib headers, nm for the symbol-table check, and a Python for the compile-time checks
        run: apt-get update && apt-get install -y --no-install-recommends zlib1g-dev binutils python3

      - name: Build
        run: swift build --build-tests

      # Same as macOS: every recipe of the cookbook compiles against the public surface on the other toolchain.
      - name: The cookbook's recipes build
        run: swift build --package-path Examples

      - name: Write API results and removed data conveniences
        run: python3 scripts/check-write-result-api.py

      # Same as macOS: an outside client compiled against this checkout, on the other toolchain.
      - name: Preservation API has an external boundary
        run: python3 scripts/check-preservation-api.py

      # And the other boundary: an outside client names formats by Codec value, and reaches no codec itself.
      - name: Codecs are chosen by value from outside
        run: python3 scripts/check-codec-api.py

      # A row-by-row write answers with the save it made, and the parts that save is built from stay inside
      # the package (spec Appendix B.51).
      - name: The row-by-row writer's save contract holds from outside
        run: python3 scripts/check-streaming-api.py

      # Same as macOS: the symbol tables of the three ways of linking, on the other toolchain and linker.
      - name: The plain products carry no cipher
        run: scripts/check-no-crypto.sh

      # Same as macOS: the suites that need LibreOffice, Numbers.app or a Python with openpyxl / numbers-parser
      # skip themselves visibly when those are absent.
      #
      # Same as macOS, the fuzz suite included: nothing here is excluded, and nothing here is expected to
      # crash. The one thing that did — Foundation's parser trapping on an element name whose bytes are not
      # valid UTF-8 — is turned away before it reaches the parser now (Appendix B.38), and so is a part naming
      # an encoding the parser does not know, which reopened the same trap.
      - name: Test
        env:
          SWIFTSHEETS_FUZZ_KEEP_DIR: ${{ github.workspace }}/.build/fuzz-mutants
        run: swift test --skip-build

      # A trap in the fuzz suite leaves the mutant that trapped on disk (FuzzTests.keeping); hand it back, so
      # the next one is diagnosed from the bytes and not from a backtrace alone.
      - name: Keep the mutant a trap left behind
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-mutants-linux
          path: .build/fuzz-mutants
          if-no-files-found: ignore

  wasm:
    name: build (WebAssembly)
    # The README names WebAssembly, so a push that stops it compiling has to fail somewhere (spec Appendix B.97) —
    # SheetEncrypt once went ten days without compiling for WASI because nothing built it. Xcode's Swift has no
    # WebAssembly backend, and a Wasm SDK serves only the Swift version it was made for, so this is the swift.org
    # Linux image and the SDK of that same version; raise both together. Behaviour is not judged here: the suite
    # does not run under a WASI runtime, and the test targets are not built (some start processes, which WASI lacks).
    runs-on: ubuntu-latest
    container: swift:6.3.3-noble
    env:
      WASM_SDK: swift-6.3.3-RELEASE_wasm
      # The checksum swift.org publishes beside the SDK; the install refuses a bundle that does not match it.
      WASM_SDK_URL: https://download.swift.org/swift-6.3.3-release/wasm-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_wasm.artifactbundle.tar.gz
      WASM_SDK_CHECKSUM: cabfa08b73bb8ac783927ecd15fa386e99d0c139c5f232445067bcf58379cae7
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: swift --version

      - name: The Wasm SDK of the same Swift version
        run: |
          swift sdk install "$WASM_SDK_URL" --checksum "$WASM_SDK_CHECKSUM"
          swift sdk list

      # Every product, as the Swift Package Index builds it.
      - name: Build every product for WASI
        run: swift build --swift-sdk "$WASM_SDK"
