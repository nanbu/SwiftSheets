  - id: "ods"
    name: "OpenDocument 表計算（.ods）"
    spec:
      name: "OASIS OpenDocument Format 1.3 — Part 3 (Schema) / Part 4 (OpenFormula)"
      public: true
      note: "公開仕様。要素名は OASIS ODF 1.3 の RelaxNG スキーマから採った。条件付き書式の richer な部分だけは本体仕様に置き場所がなく、LibreOffice の拡張名前空間 calcext: が事実上の正になっている。"
    totals:
      read: {full: 36, partial: 12, preserved: 1, none: 4, na: 6, unverified: 0}
      write: {full: 33, partial: 10, preserved: 0, none: 14, na: 2, unverified: 0}
      rows: 59
    areas:
      - id: "package"
        name: "パッケージ"
        features:
          - id: "ods.package.zip"
            name: "ODF パッケージ（mimetype を無圧縮で先頭に置く）"
            spec_anchor: "mimetype, META-INF/manifest.xml"
            read: "full"
            write: "full"
            api:
              - "Workbook(contentsOf:)"
              - "wb.write(to:as: .ods)"
            warning: null
            evidence: "judge"
            note: "先頭に非圧縮の mimetype を置く決まりを守る。LibreOffice が開き直せることで確認している。"
          - id: "ods.package.parts"
            name: "文書の 4 つの部品"
            spec_anchor: "content.xml, styles.xml, meta.xml, settings.xml"
            read: "full"
            write: "full"
            api: []
            warning: null
            evidence: "code"
            note: "settings.xml も読み書きする（ウィンドウ枠の固定など、表示の設定がここに入る）。"
          - id: "ods.package.encryption"
            name: "パスワードによる暗号化"
            spec_anchor: "manifest:encryption-data（ODF 1.3 §4.3）"
            read: "partial"
            write: "full"
            api:
              - "SheetDecrypt.decrypt(_:password:)"
              - "Workbook(contentsOf:password:)"
              - "SheetEncrypt.encrypt(_:as:password:)"
              - "Workbook.write(to:password:)"
              - "SheetError.wrongPassword"
              - "UnopenableInput.encryptedODF"
            warning: "中核だけでは throw（暗号化されていると名指しし、SheetDecrypt で開けると言う）。誤ったパスワードは wrongPassword。ODF 1.1 の Blowfish 形式は名指しで断る"
            evidence: "judge"
            note: "読みは SheetDecrypt・書きは SheetEncrypt を繋いだとき（0.17.0・Rev 4.29）。中核と 5 つの製品に暗号のコードは入らない（scripts/check-no-crypto.sh が CI で記号表を見る）。AES-CBC ＋ PBKDF2（ODF 1.2 以降、LibreOffice が書く形）を読み書きする。審判は cryptography ライブラリで ODF 1.3 §4.3 を辿る独立実装（付録 B.39.9）。"
          - id: "ods.package.opaque"
            name: "埋め込みオブジェクト・画像のパート"
            spec_anchor: "Pictures/, Object N/, ObjectReplacements/"
            read: "preserved"
            write: "none"
            api:
              - "wb.preserved"
            warning: "「N embedded object(s)/picture(s) of the source ODS are not re-linked」"
            evidence: "code"
            note: "ODS の書き出しは content.xml を作り直すので、元の絵や図の参照は張り直せない。持ってはいるが繋がらない、と正直に言う。"
          - id: "ods.draw.image"
            name: "画像の埋め込み（マスに置く・範囲に合わせる）"
            spec_anchor: "Pictures/, draw:frame, draw:image, table:end-cell-address"
            read: "none"
            write: "full"
            api:
              - "sheet.addImage(try SheetImage(data:), at: \"B2\", sizing: .resizeCellToFit)"
              - "addImage(_:over:)"
              - "SheetImage"
            warning: "読みは draw:frame を読み飛ばす — 書いた絵はこの読み手では戻らない（XLSX は preserved に持つ）"
            evidence: "judge"
