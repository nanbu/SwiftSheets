  - id: "numbers"
    name: "Apple Numbers（.numbers）"
    spec:
      name: "公開仕様なし — Numbers ユーザガイド（ヘルプ）＋実際のファイルからの観測"
      public: false
      note: "Apple は Numbers の書類形式を公開していない。この表の左の列は、①Numbers ユーザガイドが名前を与えている機能と、②書類の中に実在する保管庫の型（TN./TST./TSCH./TSD. …、numbers-parser 由来のスキーマから機械抽出した 581 種）の 2 つから作った。「仕様にこう書いてある」とは言えないので、根拠は常に観測か実測で示す。"
    totals:
      read: {full: 21, partial: 12, preserved: 0, none: 10, na: 16, unverified: 0}
      write: {full: 18, partial: 9, preserved: 0, none: 28, na: 4, unverified: 0}
      rows: 59
    areas:
      - id: "package"
        name: "書類とパッケージ"
        features:
          - id: "num.package.iwa"
            name: "書類の読み書き（IWA: Snappy 圧縮 + Protobuf）"
            spec_anchor: "Index/*.iwa, Index/Document.iwa"
            read: "full"
            write: "full"
            api:
              - "Workbook(contentsOf:)"
              - "wb.write(to:as: .numbers)"
              - "NumbersCodec"
            warning: null
            evidence: "judge"
            note: "依存のない動的な Protobuf の木（ProtoMessage）で扱う。知らない欄はバイト単位でそのまま往復する（NumbersIWATests.fixturesRoundTripByteForByte）。"
          - id: "num.package.template"
            name: "書き出しの土台（テンプレート・パッチ方式）"
            spec_anchor: "Resources/empty.numbers"
            read: "na"
            write: "partial"
            api:
              - "NumbersCodec"
            warning: "テンプレートに無い器を要る機能は、その旨を名指しして落とす"
            evidence: "readme"
            note: "numbers-parser 同梱の空の書類を土台にし、1 枚目のシート／表をその場で書き換え、2 枚目からは部分グラフを複製して新しい id と UUID を振る（仕様 §11.1）。毎回テンプレートから始まるので、往復の保全（F3）は無い。"
          - id: "num.package.encryption"
            name: "書類のパスワード保護"
            spec_anchor: ".iwph（暗号化された書類の目印）"
            read: "none"
            write: "none"
            api:
              - "SheetError.unsupportedFeature"
            warning: "throw「encrypted Numbers documents are not supported」"
            evidence: "code"
            note: "Numbers 側の「パスワードを要求」で守った書類は開かない。"
          - id: "num.package.version"
            name: "Numbers のバージョン追従"
            spec_anchor: "TN.DocumentArchive のバージョン欄"
            read: "partial"
            write: "na"
            api:
              - "wb.readWarnings"
            warning: "「Numbers document version … is newer than the verified range; read as far as possible」"
            evidence: "code"
            note: "検証済みの範囲より新しい書類でも、読めるところまで読んで、そう言う。"
          - id: "num.package.metadata"
            name: "文書プロパティ・ユーザー定義項目"
