              - "sheet.definedNames"
            warning: null
            evidence: "measured"
            note: "印刷範囲・タイトル行は _xlnm.Print_Area / _xlnm.Print_Titles として同じ場所に載る。"
          - id: "xlsx.wb.epoch"
            name: "日付の原点（1900 / 1904）"
            spec_anchor: "workbookPr@date1904"
            read: "full"
            write: "full"
            api:
              - "wb.epoch"
              - "DateEpoch"
              - "ExcelDate"
            warning: null
            evidence: "measured"
            note: "1900 年 2 月 29 日の幻の日も openpyxl と同じ扱いに揃えてある。"
          - id: "xlsx.wb.calcpr"
            name: "計算プロパティと計算チェーン"
            spec_anchor: "<calcPr>, xl/calcChain.xml"
            read: "partial"
            write: "partial"
            api: []
            warning: null
            evidence: "code"
            note: "calcChain.xml は常に捨て、fullCalcOnLoad を立てる。開いたアプリに計算し直させる方が確実なため。"
          - id: "xlsx.wb.protection"
            name: "ブックの保護（シート構成・ウィンドウの固定）"
            spec_anchor: "<workbookProtection>"
            read: "full"
            write: "full"
            api:
              - "wb.protection"
              - "WorkbookProtection"
              - "setModernPassword(_:)"
              - "setPassword(_:)"
            warning: null
            evidence: "judge"
            note: "新方式は SHA-512 のハッシュを生成。実機 Excel 16.112.2 が開錠することを AppleScript で確認（付録 B.31）。"
          - id: "xlsx.wb.views"
            name: "ブックビュー（選択中のシート）"
            spec_anchor: "<bookViews>/<workbookView activeTab>"
            read: "full"
            write: "full"
