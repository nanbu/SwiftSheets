            evidence: "code"
            note: null
          - id: "xlsx.wb.external"
            name: "外部ブックへの参照"
            spec_anchor: "<externalReferences>, xl/externalLinks/"
            read: "preserved"
            write: "preserved"
            api:
              - "FormulaExpr（[1]Sheet!A1 は文字として保持）"
            warning: "他形式へ変換すると objects の dropped 警告"
            evidence: "code"
            note: "参照先の値は解決しない。数式の中では文字列のまま運ぶので、同形式なら壊れない。"
          - id: "xlsx.wb.props"
            name: "文書プロパティ（作成者・題名・日時）"
            spec_anchor: "docProps/core.xml, docProps/app.xml"
            read: "full"
            write: "full"
            api:
              - "wb.metadata"
              - "DocumentProperties"
              - "wb.sourceInfo"
            warning: null
            evidence: "code"
            note: "生成元アプリ名は sourceInfo.application に残す。"
          - id: "xlsx.wb.customprops"
            name: "ユーザー定義の文書プロパティ"
            spec_anchor: "docProps/custom.xml"
            read: "full"
            write: "full"
            api:
              - "wb.customProperties"
              - "CustomDocumentProperty"
            warning: null
            evidence: "measured"
            note: "文字・整数・実数・真偽・日付・定義名リンクの 6 種。"
          - id: "xlsx.wb.misc"
            name: "ファイル共有・カスタムブックビュー・スマートタグ・Web 公開"
            spec_anchor: "<fileSharing>, <customWorkbookViews>, <smartTagPr>, <webPublishing>"
            read: "preserved"
            write: "preserved"
            api:
              - "wb.preserved"
            warning: "他形式へ変換すると dropped"
            evidence: "code"
            note: "<workbook> の未知の子要素はスキーマ順の位置に戻して書き出す（WorkbookWriter.workbookOrder）。"
      - id: "worksheet"
        name: "ワークシート（xl/worksheets/sheetN.xml）"
        features:
          - id: "xlsx.ws.cellvalues"
            name: "セルの値（数値・文字・真偽・エラー・インライン文字列）"
            spec_anchor: "<c t=\"n|s|str|b|e|inlineStr|d\">"
            read: "full"
            write: "full"
            api:
              - "sheet[\"A1\"]"
              - "sheet[0, 1]"
