# 形式別 機能対応表 — Excel / ODS / Numbers の公開仕様に対する SwiftSheets の対応
# 生成物。scripts/spec-feature-matrix.json を直して
# scripts/build-spec-feature-matrix.py を走らせること（手で編集しない）。
meta:
  title: "形式別 機能対応表 — Excel / ODS / Numbers の公開仕様に対する SwiftSheets の対応"
  library_version: "0.16.1"
  as_of: "2026-09-05"
  commit: "0.16.1"
  axis: "各形式の「公開仕様が持つ機能」を縦軸に置き、SwiftSheets の読み・書きの対応と API を横に並べる。docs/format-support.html（モデルの 48 項目 × 3 形式）とは軸が逆で、あちらが本表の実測の裏づけになる。"
  granularity: "「利用者から見て 1 つの機能」を 1 行とする（XML 要素 1 つを 1 行にはしない）。仕様の全要素を網羅する表ではなく、仕様の章立て・部品構成に沿って利用者が名指しできる単位で並べた。"
  caveat: "「落ちる」と書いた行は、黙って消えるのではなく必ず警告として返る。警告が返ること自体を FormatSupportTests が形式ごとの件数で固定している（xlsx 7 件 / ods 10 件 / numbers 23 件）。"
  environments:
    - "macOS 15"
    - "Swift 6.2 / Xcode 26"
    - "openpyxl 3.1.5（XLSX の審判）"
    - "LibreOffice 26.2.3（ODF の審判）"
    - "numbers-parser 4.16.3 / Numbers 15.3.1（Numbers の審判）"
    - "Microsoft Excel 16.112.2（保護の審判・付録 B.31）"
  status_vocabulary:
    full:
      symbol: "○"
      meaning: "そのまま往復する。モデルの言葉で読め、同じものが書き出される"
    partial:
      symbol: "△"
      meaning: "形を変えて通る。必ず degraded / substituted の警告が返る"
    preserved:
      symbol: "▣"
      meaning: "モデル化しない。同形式の保存では元のバイトのまま残る（F3）。他形式へ変換すると落ちて警告"
    none:
      symbol: "×"
      meaning: "通らない。落として dropped の警告を返す"
    na:
      symbol: "—"
      meaning: "その形式に概念がない"
    unverified:
      symbol: "?"
      meaning: "実測していない。推測で ○ × を書かないための欄"
  evidence_types:
    measured: "FormatSupportTests の 48 項目の実測（書いて読み戻して比べる）"
    code: "コーデックのコードで確認（要素名・警告文・保全リストの実在）"
    readme: "README / 実装仕様書 付録 B の記述"
    judge: "外部の実装が読めたこと（openpyxl・LibreOffice・numbers-parser・Numbers.app・Excel）"
  common_api:
    read: "Workbook(contentsOf:) / Workbook.read(contentsOf:) -> ReadResult / wb.readWarnings"
    write: "wb.write(to:as:) -> WriteResult / wb.data(as:) / Workbook.convert(_:to:output:)"
    detect: "SheetFormat.detect(from:)"
    warnings: "ConversionWarning(kind: .dropped/.degraded/.substituted, subject:, sheet:, location:, message:)"

formats:
  - id: "xlsx"
    name: "Excel（.xlsx / .xlsm）"
    spec:
      name: "ECMA-376 / ISO/IEC 29500 — Office Open XML SpreadsheetML"
      public: true
      note: "公開仕様。要素名は仕様のもの。SwiftSheets の実装仕様書 §7 が写像を持つ。"
    totals:
      read: {full: 46, partial: 10, preserved: 17, none: 2, na: 3, unverified: 0}
      write: {full: 48, partial: 9, preserved: 16, none: 1, na: 4, unverified: 0}
      rows: 78
    areas:
      - id: "package"
        name: "パッケージと部品"
        features:
          - id: "xlsx.package.opc"
            name: "OPC パッケージ（ZIP・コンテンツタイプ・リレーション）"
            spec_anchor: "[Content_Types].xml, _rels/.rels"
            read: "full"
            write: "full"
            api:
              - "Workbook(contentsOf:)"
              - "wb.write(to:)"
            warning: null
            evidence: "measured"
            note: "書き出しでは [Content_Types].xml が実在するパートだけを宣言し、r:id は全て解決する（PreservationTests）。"
          - id: "xlsx.package.preservation"
            name: "解釈しないパートの保全（F3）"
            spec_anchor: "xl/charts/, xl/theme/, xl/drawings/, vbaProject.bin ほか"
            read: "preserved"
            write: "preserved"
            api:
              - "wb.preserved"
              - "PreservationStore"
              - "sheet.preserved"
            warning: "他形式へ変換すると「N part(s) … cannot be carried into …」"
            evidence: "code"
            note: "触っていないパートはバイト単位で同一。既存の r:id・sheetId・パスは不変で、新規は最大値の次から採番する。"
          - id: "xlsx.package.zip64"
            name: "ZIP64（4GB 超・65,535 パート超）"
            spec_anchor: "ZIP64 end of central directory"
            read: "full"
            write: "full"
            api:
              - "ZipLimits"
              - "ReadOptions.limits"
            warning: null
            evidence: "measured"
            note: "0.12.0（付録 B.39.1）で読み書きする。4 GB 超の部品・65,535 超の部品数。ZIP64 の記録は必要な封筒にだけ書く。ZipTests が往復を固定する。この行は 0.12.0 の後も「none」のまま残っていたのを Rev 4.22 で直した。"
          - id: "xlsx.package.encryption"
            name: "パスワードによる暗号化"
            spec_anchor: "ECMA-376 Part 2 agile / standard encryption（[MS-OFFCRYPTO]）"
            read: "partial"
            write: "full"
            api:
              - "SheetDecrypt.decrypt(_:password:)"
              - "Workbook(contentsOf:password:)"
              - "SheetEncrypt.encrypt(_:as:password:)"
              - "Workbook.write(to:password:)"
              - "SheetError.wrongPassword"
              - "UnopenableInput.encryptedOOXML"
            warning: "中核だけでは throw（暗号化されていると名指しし、SheetDecrypt で開けると言う）。誤ったパスワードは wrongPassword。Excel 2007 の standard 形式と RC4 は名指しで断る"
            evidence: "judge"
            note: "読みは SheetDecrypt・書きは SheetEncrypt を繋いだとき（0.17.0・Rev 4.29）。中核と 5 つの製品に暗号のコードは入らない（scripts/check-no-crypto.sh が CI で記号表を見る）。agile 形式（AES-256 / SHA-512、Excel 2010 以降が書く形）を読み書きする。審判は msoffcrypto-tool（付録 B.39.9）。旧 .xls（BIFF）は UnopenableInput.legacyCompoundFile として別扱いで報告する。"
      - id: "workbook"
        name: "ブック（xl/workbook.xml）"
        features:
          - id: "xlsx.wb.sheets"
            name: "シートの一覧・順序・名前・複製"
            spec_anchor: "<sheets>/<sheet>"
            read: "full"
            write: "full"
            api:
              - "wb.sheets"
              - "wb.sheetNames"
              - "addSheet(named:at:)"
              - "removeSheet(named:)"
              - "moveSheet(named:to:)"
              - "duplicateSheet(named:as:)"
              - "renameSheet(_:to:)"
            warning: null
            evidence: "measured"
            note: "シート名を変えると、そのシートを指す数式が追従する。"
          - id: "xlsx.wb.state"
            name: "シートの表示状態（表示・非表示・完全非表示）"
            spec_anchor: "sheet@state"
            read: "full"
            write: "full"
            api:
              - "sheet.isHidden"
